# Layers 32 & 33: Hardened Slurm & Lustre 2.15 Parallel Filesystem Security Policy
SlurmctldParameters=enable_configless,constrain_devices
PrologFlags=Contain,Alloc
TaskPlugin=task/cgroup,task/affinity
# Lustre SSK (Shared Secret Key) & Nodemap Tenant Isolation
lctl nodemap_add tenant_research_alpha
lctl nodemap_modify --name tenant_research_alpha --property trusted --value 0
lctl nodemap_modify --name tenant_research_alpha --property admin --value 0
